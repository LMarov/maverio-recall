lse }}\">\n        <div style=\"padding:26px 28px 40px;max-width:760px\">\n          <h1 style=\"font:600 27px/1.15 Poppins,sans-serif;color:var(--ink);margin:0 0 5px;letter-spacing:-.01em\">Capture &amp; policy<\u002Fh1>\n          <div style=\"font:500 12.5px Manrope,sans-serif;color:var(--ink2);margin-bottom:16px\">{{ policyIntro }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:{{ ownerBannerBg }};border:1px solid {{ ownerBannerBorder }};margin-bottom:22px\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:{{ ownerBannerDot }};flex:none;display:block\"><\u002Fspan>\n            <span style=\"font:600 11.5px/1.5 Manrope,sans-serif;color:var(--ink2)\">{{ policyBanner }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:9px\">\n            <sc-for list=\"{{ settings }}\" as=\"s\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:15px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"min-width:0\">\n                  <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                    <span style=\"font:700 13px Manrope,sans-serif;color:var(--ink)\">{{ s.label }}<\u002Fspan>\n                    <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.05em;padding:2.5px 7px;border-radius:5px;background:var(--panel3);color:var(--ink3);display:{{ s.lockDisplay }}\">OWNER ONLY<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font:500 11.5px/1.55 Manrope,sans-serif;color:var(--ink2)\">{{ s.help }}<\u002Fdiv>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ s.toggle }}\" title=\"{{ s.title }}\" style=\"width:44px;height:25px;border-radius:20px;border:0;background:{{ s.track }};position:relative;flex:none;opacity:{{ s.opacity }};cursor:{{ s.cursor }}\">\n                  <span style=\"position:absolute;top:3px;left:{{ s.knob }};width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .16s ease;display:block\"><\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"margin-top:22px;padding:15px 17px;border-radius:11px;background:var(--tint);font:500 12px/1.65 Manrope,sans-serif;color:var(--ink2)\">Recall never joins the call as a participant and adds no plugin — it captures the Mac's own audio output plus your microphone. Recording law varies by state and country; keep <strong style=\"color:var(--ink)\">Disclosure prompt<\u002Fstrong> on unless your legal counsel has cleared one-party consent for the jurisdictions you work in.<\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n\n      <!-- ask rail -->\n      <sc-if value=\"{{ scrim }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ toggleRail }}\" style=\"position:absolute;inset:52px 0 0;background:rgba(10,17,22,.34);z-index:5\"><\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ railOpen }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"flex:none;position:{{ railPos }};top:52px;right:0;bottom:0;z-index:6;box-shadow:{{ railShadow }};width:{{ railW }};max-width:100%;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel2);min-height:0\">\n        <div style=\"flex:none;padding:16px 16px 12px;border-bottom:1px solid var(--line)\">\n          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:linear-gradient(90deg,#4192B9,#5AC3A7);display:block\"><\u002Fspan>\n            <span style=\"font:700 12.5px Manrope,sans-serif;color:var(--ink)\">Ask your meetings<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">{{ askScope }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:13px;min-height:0\">\n          <sc-for list=\"{{ chat }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"animation:rise .22s ease both\">\n              <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.2em;color:{{ c.tagColor }};margin-bottom:6px\">{{ c.tag }}<\u002Fdiv>\n              <div style=\"font:500 13px/1.68 Manrope,sans-serif;color:{{ c.fg }};background:{{ c.bg }};border:1px solid {{ c.border }};padding:11px 13px;border-radius:10px;text-wrap:pretty\">{{ c.text }}<\u002Fdiv>\n              <sc-if value=\"{{ c.hasCites }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px\">\n                  <sc-for list=\"{{ c.cites }}\" as=\"q\" hint-placeholder-count=\"2\">\n                    <button sc-camel-on-click=\"{{ q.open }}\" style=\"display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:600 10.5px Manrope,sans-serif\" style-hover=\"border-color:var(--aqua1);color:var(--ink)\">\n                      <span style=\"width:5px;height:5px;border-radius:50%;background:{{ q.dot }};display:block\"><\u002Fspan>{{ q.label }}\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ thinking }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:600 11.5px Manrope,sans-serif;color:var(--ink3)\">Reading 8 meetings…<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"flex:none;padding:11px 14px 14px;border-top:1px solid var(--line)\ px Manrope,sans-serif\">{{ t.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:4px 8px 10px;border-top:1px solid var(--line2)\">\n        <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.24em;color:var(--ink3);padding:8px 8px 6px\">PREVIEW AS<\u002Fdiv>\n        <sc-for list=\"{{ accountList }}\" as=\"a\" hint-placeholder-count=\"3\">\n          <button sc-camel-on-click=\"{{ a.pick }}\" style=\"display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border:0;border-radius:8px;background:{{ a.bg }};font:600 12px Manrope,sans-serif;color:var(--ink);text-align:left\" style-hover=\"background:var(--tint)\">\n            <span style=\"width:22px;height:22px;border-radius:50%;background:{{ a.color }};color:#fff;display:grid;place-items:center;font:700 8px Manrope,sans-serif;flex:none\">{{ a.ini }}<\u002Fspan>\n            <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.name }}<\u002Fspan>\n            <span style=\"font:600 9.5px Manrope,sans-serif;color:var(--ink3)\">{{ a.role }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n        <div style=\"font:500 10.5px/1.5 Manrope,sans-serif;color:var(--ink3);padding:8px 9px 0\">Audit log is on — every read and export is recorded against the account above.<\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- live HUD pill -->\n  <sc-if value=\"{{ recording }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;bottom:22px;left:50%;transform:translateX(-50%);z-index:9;display:flex;align-items:center;flex-wrap:nowrap;width:max-content;max-width:96%;overflow:hidden;gap:13px;padding:9px 13px;border-radius:36px;background:rgba(10,17,22,.94);border:1px solid rgba(255,255,255,.13);box-shadow:0 16px 44px rgba(0,0,0,.44);backdrop-filter:blur(14px);animation:rise .2s ease both\">\n      <span style=\"width:9px;height:9px;border-radius:50%;background:#FF6A00;animation:recdot 1.3s ease-in-out infinite,ring 1.8s ease-out infinite;flex:none;display:block\"><\u002Fspan>\n      <span style=\"font:600 12px JetBrains Mono,monospace;color:#fff;flex:none\">{{ elapsed }}<\u002Fspan>\n      <span style=\"width:1px;height:20px;background:rgba(255,255,255,.16);display:block\"><\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:nowrap;flex:0 0 auto\">\n        <sc-for list=\"{{ liveSpeakers }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 3px;border-radius:20px;background:{{ s.chipBg }};border:1px solid {{ s.chipBorder }};animation:rise .28s ease both;flex:none\">\n            <span style=\"width:20px;height:20px;border-radius:50%;background:{{ s.color }};color:#fff;display:grid;place-items:center;font:700 8px Manrope,sans-serif;opacity:{{ s.op }};flex:none\">{{ s.ini }}<\u002Fspan>\n            <span style=\"font:700 10.5px Manrope,sans-serif;color:{{ s.nameFg }};white-space:nowrap\">{{ s.name }}<\u002Fspan>\n            <div style=\"display:flex;align-items:center;gap:2px;height:14px\">\n              <sc-for list=\"{{ s.bars }}\" as=\"b\" hint-placeholder-count=\"4\">\n                <span style=\"width:2.5px;height:14px;border-radius:2px;background:{{ s.bg }};transform-origin:center;animation:lvl {{ b.dur }} ease-in-out infinite;animation-delay:{{ b.delay }};display:block\"><\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ pendingVoices }}\" hint-placeholder-val=\"{{ false }}\">\n          <span style=\"font:600 10.5px Manrope,sans-serif;color:rgba(255,255,255,.5);white-space:nowrap\">{{ pendingLabel }}<\u002Fspan>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <span style=\"width:1px;height:20px;background:rgba(255,255,255,.16);display:block\"><\u002Fspan>\n      <button sc-camel-on-click=\"{{ toggleScreenRec }}\" title=\"{{ screenTitle }}\" style=\"display:flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:20px;border:1px solid {{ screenBorder }};background:{{ screenChipBg }};color:{{ screenChipFg }};font:700 10.5px Manrope,sans-serif\">\n        <span style=\"font-size:11px;line-height:1\">⧉<\u002Fspan>{{ screenChipLabel }}\n      <\u002Fbutton>\n      <button sc-camel-on-click=\"{{ toggleRecord }}\" style=\"height:26px;padding:0 12px;border-radius:20px;border:0;background:rgba(255,255,255,.14);color:#fff;font:700 10.5px Manrope,sans-serif\">STOP<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- voice naming modal -->\n  <sc-if value=\"{{ namerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:absolute;inset:0;z-index:14;background:rgba(10,17,22,.5);backdrop-filter:blur(3px);display:grid;place-items:center;padding:24px\">\n      <div style=\"width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:rise .2s ease both\">\n        <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:9px\">NAME THIS VOICE<\u002Fdiv>\n        <div style=\"font:600 17px/1.35 Poppins,sans-serif;color:var(--ink);margin-bottom:6px\">{{ namerTitle }}<\u002Fdiv>\n        <div style=\"font:500 12px/1.6 Manrope,sans-serif;color:var(--ink2);margin-bottom:16px\">{{ namerHint }}<\u002Fdiv>\n        <div style=\"display:flex;align-items:flex-end;gap:2px;height:38px;margin-bottom:16px\">\n          <sc-for list=\"{{ namerWave }}\" as=\"w\" hint-placeholder-count=\"34\">\n            <span style=\"flex:1;height:{{ w.h }};background:linear-gradient(180deg,#4192B9,#5AC3A7);border-radius:2px;opacity:.65;display:block\"><\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"font:700 9.5px Manrope,sans-serif;letter-spacing:.1em;color:var(--ink3);margin-bottom:8px\">SUGGESTED FROM THE INVITE<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px\">\n          <sc-for list=\"{{ namerSuggestions }}\" as=\"s\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ s.pick }}\" style=\"height:29px;padding:0 12px;border-radius:8px;border:1px solid {{ s.border }};background:{{ s.bg }};color:{{ s.fg }};font:700 11.5px Manrope,sans-serif\">{{ s.label }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <input value=\"{{ namerDraft }}\" sc-camel-on-change=\"{{ onNamerDraft }}\" placeholder=\"Or type a name\" style=\"width:100%;height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font:500 13px Manrope,sans-serif;color:var(--ink);margin-bottom:8px\">\n        <label style=\"display:flex;align-items:center;gap:8px;font:500 11.5px Manrope,sans-serif;color:var(--ink2);margin-bottom:18px\">\n          <input type=\"checkbox\" checked=\"{{ namerApplyAll }}\" sc-camel-on-change=\"{{ onNamerApplyAll }}\" style=\"accent-color:#4192B9;width:15px;height:15px\">\n          Apply to all 4 past meetings with this voiceprint\n        <\u002Flabel>\n        <div style=\"display:flex;gap:8px\">\n          <button sc-camel-on-click=\"{{ closeNamer }}\" style=\"flex:none;height:36px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink2);font:700 12px Manrope,sans-serif\">Cancel<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ saveNamer }}\" style=\"flex:1;height:36px;border-radius:9px;border:0;background:linear-gradient(90deg,#4192B9,#5AC3A7);color:#fff;font:700 12px Manrope,sans-serif\">Save voiceprint<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;defaultTheme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;section&quot;:&quot;Appearance&quot;},&quot;redactionOn&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Export&quot;}}\">\nconst AQ1='#4192B9', AQ2='#5AC3A7';\nconst PR={\n  'Consulting':{c:'#7835FE',t:'rgba(120,53,254,.12)'},\n  'Growth iQ':{c:'#27AC53',t:'rgba(39,172,83,.12)'},\n  'Capability':{c:'#FF6A00',t:'rgba(255,106,0,.12)'},\n  'Internal':{c:'#4192B9',t:'rgba(65,146,185,.13)'}\n};\nconst P={\n  DO:{n:'Lana Marov',c:'#4192B9',r:'Strategy Director · Maverio'},\n  PR:{n:'Priya Raman',c:'#27AC53',r:'Growth iQ lead · Maverio'},\n  TL:{n:'Tom Lasky',c:'#7835FE',r:'Delivery · Maverio'},\n  NF:{n:'Nadia Fenn',c:'#FF6A00',r:'Capability · Maverio'},\n  MB:{n:'Marcus Bell',c:'#C9A24A',r:'Partner · Maverio'},\n  IK:{n:'Ines Kovač',c:'#0195BD',r:'COO · Hartline Logistics'},\n  RS:{n:'Ray Sandoval',c:'#88DB0D',r:'CFO · Verdon Health'},\n  EK:{n:'Elena Kessler',c:'#AC51F6',r:'Managing Partner · Kessler & Roe'}\n};\nconst ini = n => n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();\nconst replaceAll = (str,find,rep) => str.split(find).join(rep);\nconst hm = v => { const n=parseInt(v,10)||0; const h=Math.floor(n/60), m=n%60;\n  return h ? (m ? h+'h '+m+'m' : h+'h') : m+'m'; };\n\nconst MEET=[\n {id:'m1',title:'Diagnostic readout',client:'Hartline Logistics',practice:'Consulting',dow:'FRI',day:'4',mon:'SEP',time:'10:00',dur:'62 min',dec:3,act:5,people:['DO','TL','IK'],unknown:1,\n  summary:'Hartline accepted the diagnostic: their cost-to-serve problem is routing discipline, not headcount. Ines pushed back on the 90-day timeline and we agreed to a phased delivery with a paid pilot on the Midlands depot first. Fee discussion landed at £84k for phase one, with phase two contingent on pilot metrics.',\n  decisions:[{text:'Phase delivery — Midlands depot pilot first, national rollout gated on a 6% cost-to-serve improvement.',cite:'m1 · 18:42 · Ines Kovač'},\n             {text:'Phase one fee set at £84,000, invoiced monthly across three months.',cite:'m1 · 41:07 · Lana Marov'},\n             {text:'Tom embeds two days a week on site rather than running it remote.',cite:'m1 · 52:19 · Tom Lasky'}],\n  objective:'Get Hartline to fund delivery without signing the 90-day national programme they were resisting.',\n  objectiveCite:'18:42 · Ines Kovač',\n  gaps:[{q:'Who is the finance owner for the pilot budget line?',why:'Ines said she can get £84k through finance without a board paper, but never named a person.',cite:'41:44 · Ines Kovač'},\n        {q:'What is the deadline for “send it this week”?',why:'The SOW was committed to “this week” with no date said aloud.',cite:'41:44 · Ines Kovač'}],\n  actions:[{who:'TL',text:'Draft the pilot scope and the depot data request',due:'Mon 8 Sep',src:'26:38 · Tom Lasky'},\n           {who:'DO',text:'Send the phased SOW with the £84,000 phase-one fee',due:'“this week” — no date stated',src:'41:07 · Lana Marov'},\n           {who:'IK',text:'Take the £84k pilot budget line through finance',due:'not stated',src:'41:44 · Ines Kovač'},\n           {who:'TL',text:'Arrange the depot walkthrough via Priya, who runs that calendar',due:'not stated',src:'58:02 · Ines Kovač'}],\n  fields:[{key:'client',val:'Hartline Logistics'},{key:'engagement_stage',val:'Diagnostic → Delivery (proposal out)'},{key:'practice',val:'Consulting'},{key:'revenue_mentioned',val:'£84,000 phase one · £210,000 indicative phase two'},{key:'risks',val:'Timeline pressure; depot data quality unverified'},{key:'decision_maker',val:'Ines Kovač (COO)'},{key:'next_step',val:'Phased SOW by 9 Sep'}],\n  lines:[\n   {t:'00:12',k:'DO',text:'Before we get into the numbers — the short version is that we came in expecting a headcount story and the data told us something different.'},\n   {t:'00:31',k:'IK',text:'Different how? Because the board has been told this is a staffing problem for two years.'},\n   {t:'01:04',k:'TL',text:'Cost-to-serve variance across your depots is 34%. Same volumes, same vehicle mix. That is routing discipline, not people.'},\n   {t:'02:20',k:'IK',text:'That is going to be an awkward conversation upstairs, but I would rather have it now.'},\n   {t:'18:42',k:'IK',text:'I am not signing a 90-day national programme on a slide. Give me one depot, give me a number I can hold you to, and I will fund the rest.'},\n   {t:'19:15',k:'DO',text:'Then we phase it. Midlands depot pilot, six percent improvement in cost-to-serve as the gate, national rollout after.'},\n   {t:'26:03',k:'?1',text:'Sorry — can I ask about the data extract? Our warehouse system only keeps eight weeks of route history.'},\n   {t:'26:38',k:'TL',text:'Eight weeks is enough for the pilot baseline. We will need a longer pull before rollout.'},\n   {t:'41:07',k:'DO',text:'Phase one is eighty-four thousand, invoiced monthly across the three months. Phase two we scope after the gate.'},\n   {t:'41:44',k:'IK',text:'That I can get through finance without a board paper. Send it this week.'},\n   {t:'52:19',k:'TL',text:'One condition from my side — I want two days a week on site. Remote delivery on a routing problem does not work.'},\n   {t:'58:02',k:'IK',text:'Fine. Talk to Priya about the depot walkthrough, she runs that calendar.'}]},\n\n {id:'m2',title:'Pricing model review',client:'Verdon Health',practice:'Growth iQ',dow:'THU',day:'3',mon:'SEP',time:'14:30',dur:'48 min',dec:2,act:3,people:['PR','MB','RS'],unknown:0,\n  summary:'Verdon wants the Growth iQ benchmark data licensed rather than delivered as a report. Ray floated an annual seat model; Priya held the line on the report plus a data addendum. Real signal here: three of their competitors have asked us the same thing this quarter — there is a product in this.',\n  decisions:[{text:'Sell the Q4 benchmark as a report plus a data addendum, not a seat licence.',cite:'m2 · 22:10 · Priya Raman'},\n             {text:'Price the addendum at £18k annually, renewable with the report cycle.',cite:'m2 · 35:50 · Marcus Bell'}],\n  objective:'Keep Verdon on the report model while giving them enough data access to renew.',\n  objectiveCite:'22:10 · Priya Raman',\n  gaps:[{q:'Which data cuts does Verdon actually need in the addendum?',why:'Priya offered “the cuts you need”; the specific cuts were never listed on the call.',cite:'22:10 · Priya Raman'},\n        {q:'Do you want the peer product idea scoped now?',why:'Marcus noted three peers asked for the same thing, but no owner or date was agreed.',cite:'44:10 · Marcus Bell'}],\n  actions:[{who:'PR',text:'Send the addendum terms with the cut list for Verdon',due:'not stated',src:'22:10 · Priya Raman'},\n           {who:'RS',text:'Get the £18k addendum into the Q4 budget',due:'Q4 budget cycle',src:'36:22 · Ray Sandoval'}],\n  fields:[{key:'client',val:'Verdon Health'},{key:'engagement_stage',val:'Renewal / upsell'},{key:'practice',val:'Growth iQ'},{key:'revenue_mentioned',val:'£18,000 data addendum (annual)'},{key:'risks',val:'Client prefers seat licence; IP exposure on raw benchmark'},{key:'decision_maker',val:'Ray Sandoval (CFO)'},{key:'next_step',val:'Addendum terms by 5 Sep'}],\n  lines:[\n   {t:'00:20',k:'RS',text:'The report is good. What we actually want is the underlying data, in our own tooling.'},\n   {t:'03:41',k:'PR',text:'I understand the pull. The problem is the benchmark is only defensible with our methodology attached to it.'},\n   {t:'22:10',k:'PR',text:'Here is where I can go — the report as it stands, plus a data addendum with the cuts you need. Not a seat licence to the whole set.'},\n   {t:'35:50',k:'MB',text:'Eighteen thousand a year for the addendum, renewing with the report. That is the number.'},\n   {t:'36:22',k:'RS',text:'I can defend eighteen. Send it and I will get it into the Q4 budget.'},\n   {t:'44:10',k:'MB',text:'Priya, worth noting three of their peers asked for the same thing this quarter. There is a product here.'}]},\n\n {id:'m3',title:'Monday ops',client:'Maverio internal',practice:'Internal',dow:'TUE',day:'2',mon:'SEP',time:'09:00',dur:'24 min',dec:1,act:4,people:['DO','PR','TL','NF','MB'],unknown:0,\n  summary:'Capacity is the constraint, not pipeline. Tom is at 110% with Hartline landing, Nadia has Kessler kickoff prep, and Marcus wants the Growth iQ product idea scoped before it gets lost. Agreed to hold new Consulting proposals for two weeks.',\n  decisions:[{text:'Hold new Consulting proposals for two weeks until Hartline phase one is staffed.',cite:'m3 · 14:20 · Marcus Bell'}],\n  objective:'Protect delivery capacity while Hartline lands.',\n  objectiveCite:'14:20 · Marcus Bell',\n  gaps:[{q:'What comes off Tom, specifically?',why:'Tom said something has to come off him at 110%; no one named which engagement.',cite:'02:15 · Tom Lasky'},\n        {q:'Who owns the data-product thread?',why:'Priya flagged it as a signal but no owner or date was said.',cite:'19:40 · Priya Raman'}],\n  actions:[{who:'DO',text:'Take work off Tom before Hartline starts — item not named on the call',due:'not stated',src:'02:15 · Tom Lasky'},\n           {who:'MB',text:'Hold new Consulting proposals for two weeks',due:'two weeks from 2 Sep',src:'14:20 · Marcus Bell'}],\n  fields:[{key:'client',val:'— internal'},{key:'engagement_stage',val:'n/a'},{key:'practice',val:'Internal'},{key:'revenue_mentioned',val:'—'},{key:'risks',val:'Delivery capacity at 110% for two weeks'},{key:'decision_maker',val:'Marcus Bell'},{key:'next_step',val:'iQ product one-pager by 5 Sep'}],\n  lines:[\n   {t:'02:15',k:'TL',text:'If Hartline lands this week I am at a hundred and ten percent. Something has to come off me.'},\n   {t:'14:20',k:'MB',text:'Then we hold new Consulting proposals for two weeks. Pipeline is not our problem right now, capacity is.'},\n   {t:'19:40',k:'PR',text:'Do not lose the data-product thread. Three inbound asks in a quarter is a signal.'}]},\n\n {id:'m4',title:'Capability kickoff',client:'Kessler & Roe',practice:'Capability',dow:'FRI',day:'29',mon:'AUG',time:'11:00',dur:'71 min',dec:4,act:6,people:['NF','MB','EK'],unknown:2,\n  summary:'Kessler wants their senior associates to run client diagnostics themselves within two quarters. Elena was blunt that previous training did not stick because nothing changed in how work was reviewed. Agreed the programme is built around live client files, not case studies.',\n  decisions:[{text:'Programme runs on live client files, not case studies.',cite:'m4 · 24:05 · Elena Kessler'},\n             {text:'Six cohorts of eight, fortnightly, over two quarters.',cite:'m4 · 38:12 · Nadia Fenn'},\n             {text:'Partner review checklist changes at the same time or the training does not count.',cite:'m4 · 51:30 · Elena Kessler'},\n             {text:'Fee £126k across two quarters, 40% on kickoff.',cite:'m4 · 63:18 · Marcus Bell'}],\n  objective:'Build a capability programme that changes how work is reviewed, not just what associates are taught.',\n  objectiveCite:'24:05 · Elena Kessler',\n  gaps:[{q:'Who signs the £126k SOW, and by when?',why:'Marcus stated the fee and milestone; no signatory or date was discussed.',cite:'63:18 · Marcus Bell'},\n        {q:'Which cohort runs hybrid, and who picks the participants?',why:'Nadia agreed one hybrid cohort to test remote; the cohort and selection owner were not named.',cite:'45:22 · Nadia Fenn'}],\n  actions:[{who:'NF',text:'Build the curriculum on live client files across six fortnightly cohorts of eight',due:'not stated',src:'38:12 · Nadia Fenn'},\n           {who:'NF',text:'Revise the partner review checklist alongside the programme',due:'not stated',src:'51:30 · Elena Kessler'},\n           {who:'MB',text:'Issue the £126,000 SOW with 40% at kickoff',due:'not stated',src:'63:18 · Marcus Bell'},\n           {who:'NF',text:'Run one cohort hybrid to test whether it holds up remote',due:'not stated',src:'45:22 · Nadia Fenn'}],\n  fields:[{key:'client',val:'Kessler & Roe'},{key:'engagement_stage',val:'Kickoff / delivery'},{key:'practice',val:'Capability'},{key:'revenue_mentioned',val:'£126,000 across two quarters'},{key:'risks',val:'Prior training failed; partner review behaviour must change'},{key:'decision_maker',val:'Elena Kessler (Managing Partner)'},{key:'next_step',val:'Curriculum outline by 4 Sep'}],\n  lines:[\n   {t:'24:05',k:'EK',text:'We have done training before. It did not stick because nothing changed in how the work got reviewed. Build it on live files or do not build it.'},\n   {t:'38:12',k:'NF',text:'Six cohorts of eight, fortnightly, across two quarters. That is the shape that survives a fee-earner calendar.'},\n   {t:'44:50',k:'?2',text:'Would that include the associates in the Manchester office, or London only?'},\n   {t:'45:22',k:'NF',text:'Both. We run one cohort hybrid to test whether it holds up remote.'},\n   {t:'51:30',k:'EK',text:'And the partner review checklist changes at the same time. Otherwise this is theatre.'},\n   {t:'63:18',k:'MB',text:'A hundred and twenty-six across the two quarters, forty percent at kickoff.'}]},\n\n {id:'m5',title:'Discovery call',client:'Northmoor Retail',practice:'Consulting',dow:'THU',day:'28',mon:'AUG',time:'15:00',dur:'39 min',dec:1,act:2,people:['DO','TL'],unknown:1,\n  summary:'Northmoor is shopping for a growth diagnostic but the brief is really a margin problem dressed as a demand problem. No budget confirmed. Worth a short paid diagnostic if they can name an owner.',\n  decisions:[{text:'Offer a two-week paid diagnostic rather than a full proposal.',cite:'m5 · 31:02 · Lana Marov'}],\n  objective:'Reframe Northmoor’s demand brief as a margin problem and sell a short paid diagnostic instead of a proposal.',\n  objectiveCite:'08:14 · Lana Marov',\n  gaps:[{q:'Who is the budget owner at Northmoor?',why:'No name or budget was given anywhere in the call.',cite:'not discussed'},\n        {q:'What price goes on the tw
