document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:50%;background:{{ r.color }};color:#fff;display:grid;place-items:center;font:700 8px Manrope,sans-serif\">{{ r.ini }}<\u002Fspan>\n                  <span style=\"font:700 12px Manrope,sans-serif;color:var(--ink)\">{{ r.who }}<\u002Fspan>\n                  <span style=\"font:500 11px JetBrains Mono,monospace;color:var(--ink3)\">{{ r.at }}<\u002Fspan>\n                  <span style=\"font:600 11px Manrope,sans-serif;color:var(--ink3)\">· {{ r.meeting }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"font:500 13px/1.6 Manrope,sans-serif;color:var(--ink2)\">{{ r.pre }}<mark style=\"background:rgba(90,195,167,.28);color:var(--ink);border-radius:3px;padding:0 2px;font-weight:700\">{{ r.hit }}<\u002Fmark>{{ r.post }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{ noResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:34px;border:1px dashed var(--line);border-radius:11px;text-align:center;font:500 13px Manrope,sans-serif;color:var(--ink2)\">Nothing matched. Try a client name, a decision, or a person.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ MEETING DETAIL ============ -->\n        <sc-if value=\"{{ isMeeting }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"padding:22px 28px 0\">\n            <button sc-camel-on-click=\"{{ backToLibrary }}\" style=\"border:0;background:transparent;padding:0;font:600 11.5px Manrope,sans-serif;color:var(--ink2);margin-bottom:14px\">← Timeline<\u002Fbutton>\n            <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px\">\n              <span style=\"font:700 9.5px Manrope,sans-serif;letter-spacing:.06em;padding:3px 8px;border-radius:5px;background:{{ cur.pTint }};color:{{ cur.pColor }}\">{{ cur.practice }}<\u002Fspan>\n              <span style=\"font:600 11.5px Manrope,sans-serif;color:var(--ink3)\">{{ cur.client }}<\u002Fspan>\n            <\u002Fdiv>\n            <sc-if value=\"{{ notEditingTitle }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:flex;align-items:center;gap:10px;margin:0 0 7px;flex-wrap:wrap\">\n                <h1 style=\"font:600 26px/1.2 Poppins,sans-serif;color:var(--ink);margin:0;letter-spacing:-.01em\">{{ cur.title }}<\u002Fh1>\n                <button sc-camel-on-click=\"{{ startEditTitle }}\" title=\"Rename this meeting\" style=\"display:flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font:700 11px Manrope,sans-serif\">\n                  <span style=\"font-size:11px;line-height:1\">✎<\u002Fspan>Edit\n                <\u002Fbutton>\n                <sc-if value=\"{{ titleEdited }}\" hint-placeholder-val=\"{{ false }}\">\n                  <span style=\"font:600 10px Manrope,sans-serif;letter-spacing:.1em;color:var(--ink3);background:var(--panel3);padding:3px 8px;border-radius:5px\">RENAMED BY YOU<\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ editingTitle }}\" hint-placeholder-val=\"{{ false }}\">\n              <form sc-camel-on-submit=\"{{ saveTitle }}\" style=\"display:flex;gap:8px;align-items:center;margin:0 0 7px;flex-wrap:wrap\">\n                <input value=\"{{ titleDraft }}\" sc-camel-on-change=\"{{ onTitleDraft }}\" sc-camel-auto-focus=\"{{ true }}\" style=\"flex:1;min-width:240px;height:42px;padding:0 13px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:600 20px Poppins,sans-serif\">\n                <button type=\"submit\" style=\"height:38px;padding:0 15px;border-radius:9px;border:0;background:linear-gradient(90deg,#4192B9,#5AC3A7);color:#fff;font:700 12px Manrope,sans-serif\">Save<\u002Fbutton>\n                <button type=\"button\" sc-camel-on-click=\"{{ cancelEditTitle }}\" style=\"height:38px;padding:0 13px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font:700 12px Manrope,sans-serif\">Cancel<\u002Fbutton>\n              <\u002Fform>\n            <\u002Fsc-if>\n            <div style=\"font:500 12.5px Manrope,sans-serif;color:var(--ink2)\">{{ cur.metaLine }}<\u002Fdiv>\n            <sc-if value=\"{{ analysing }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin-top:16px;padding:13px 16px;border:1px solid var(--line2);border-radius:11px;background:var(--tint);display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n                <span style=\"display:flex;align-items:center;gap:7px;font:700 10px Manrope,sans-serif;letter-spacing:.14em;color:#27AC53\"><span style=\"width:7px;height:7px;border-radius:50%;background:#27AC53;display:block\"><\u002Fspan>TRANSCRIPT COMPLETE<\u002Fspan>\n                <span style=\"flex:1;min-width:220px;font:500 12.5px/1.6 Manrope,sans-serif;color:var(--ink2)\">Speakers are separated and the full transcript is readable now. Decisions, actions and extracted fields are still being analysed and will fill in on the Summary tab.<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:3px;margin-top:18px;border-bottom:1px solid var(--line)\">\n              <sc-for list=\"{{ tabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ t.go }}\" style=\"padding:9px 14px;border:0;background:transparent;border-bottom:2px solid {{ t.line }};color:{{ t.fg }};font:700 12px Manrope,sans-serif;margin-bottom:-1px\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ tabSummary }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"padding:22px 28px 40px;display:flex;flex-direction:column;gap:22px\">\n            <div style=\"padding:18px 20px;border-radius:12px;background:var(--tint);border:1px solid var(--line2)\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:11px\">\n                <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">KEY OBJECTIVE<\u002Fspan>\n                <span style=\"font:500 10.5px JetBrains Mono,monospace;color:var(--ink3)\">{{ objectiveCite }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"font:700 18px/1.4 Poppins,sans-serif;color:var(--ink);text-wrap:pretty\">{{ objective }}<\u002Fdiv>\n              <div style=\"height:1px;background:var(--line2);margin:16px 0 14px\"><\u002Fdiv>\n              <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:9px\">AI SUMMARY · FROM THE RECORDING ONLY<\u002Fdiv>\n              <sc-if value=\"{{ analysing }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:9px;font:700 10px Manrope,sans-serif;letter-spacing:.14em;color:#FF6A00\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FF6A00;display:block\"><\u002Fspan>ANALYSING · TRANSCRIPT ALREADY DONE<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font:500 14px/1.65 Manrope,sans-serif;color:var(--ink);text-wrap:pretty\">{{ cur.summary }}<\u002Fdiv>\n              <div style=\"margin-top:12px;font:500 11.5px/1.6 Manrope,sans-serif;color:var(--ink3);text-wrap:pretty\">Written only from what was said. Nothing is inferred to fill a gap — anything missing is listed as a question below.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:10px\">DECISIONS<\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ cur.decisions }}\" as=\"d\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:11px;padding:12px 14px;border:1px solid var(--line);border-radius:9px\">\n                    <span style=\"width:5px;border-radius:3px;background:linear-gradient(180deg,#4192B9,#5AC3A7);flex:none;display:block\"><\u002Fspan>\n                    <div style=\"min-width:0\">\n                      <div style=\"font:600 13.5px/1.5 Manrope,sans-serif;color:var(--ink)\">{{ d.text }}<\u002Fdiv>\n                      <div style=\"font:500 11px JetBrains Mono,monospace;color:var(--ink3);margin-top:5px\">{{ d.cite }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px\">\n                <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">ACTIONS<\u002Fspan>\n                <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">{{ actionCount }} · each traced to a line in the recording<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:7px\">\n                <sc-for list=\"{{ cur.actions }}\" as=\"a\" hint-placeholder-count=\"3\">\n                  <div style=\"display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:13px;align-items:start;padding:13px 15px;border:1px solid var(--line);border-radius:10px\">\n                    <span style=\"display:flex;flex-direction:column;align-items:center;gap:6px\">\n                      <span style=\"font:700 10px JetBrains Mono,monospace;color:var(--ink3)\">{{ a.n }}<\u002Fspan>\n                      <span style=\"width:24px;height:24px;border-radius:50%;background:{{ a.color }};color:#fff;display:grid;place-items:center;font:700 8.5px Manrope,sans-serif\">{{ a.ini }}<\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"min-width:0\">\n                      <span style=\"display:block;font:600 13.5px/1.45 Manrope,sans-serif;color:var(--ink)\">{{ a.text }}<\u002Fspan>\n                      <span style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:6px\">\n                        <span style=\"font:600 11px Manrope,sans-serif;color:var(--ink2)\">{{ a.who }}<\u002Fspan>\n                        <span style=\"font:500 10.5px JetBrains Mono,monospace;color:var(--ink3)\">{{ a.srcLabel }}<\u002Fspan>\n                      <\u002Fspan>\n                    <\u002Fspan>\n                    <span style=\"font:700 10.5px Manrope,sans-serif;color:{{ a.dueFg }};background:{{ a.dueBg }};padding:5px 9px;border-radius:6px;white-space:nowrap\">{{ a.due }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ hasGaps }}\" hint-placeholder-val=\"{{ true }}\">\n            <div>\n              <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px\">\n                <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:#FF6A00\">QUESTIONS FOR YOU<\u002Fspan>\n                <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">{{ gapCount }} · not said on the recording, so not answered here<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;flex-direction:column;gap:8px\">\n                <sc-for list=\"{{ gaps }}\" as=\"g\" hint-placeholder-count=\"2\">\n                  <div style=\"padding:14px 16px;border:1px solid rgba(255,106,0,.35);border-radius:10px;background:rgba(255,106,0,.05)\">\n                    <div style=\"display:flex;gap:11px;align-items:baseline\">\n                      <span style=\"font:700 10px JetBrains Mono,monospace;color:#FF6A00\">{{ g.n }}<\u002Fspan>\n                      <div style=\"min-width:0;flex:1\">\n                        <div style=\"font:600 13.5px/1.45 Manrope,sans-serif;color:var(--ink)\">{{ g.q }}<\u002Fdiv>\n                        <div style=\"font:500 11.5px/1.6 Manrope,sans-serif;color:var(--ink2);margin-top:5px\">{{ g.why }}<\u002Fdiv>\n                        <div style=\"font:500 10.5px JetBrains Mono,monospace;color:var(--ink3);margin-top:5px\">{{ g.citeLabel }}<\u002Fdiv>\n                        <sc-if value=\"{{ g.unanswered }}\" hint-placeholder-val=\"{{ true }}\">\n                          <form sc-camel-on-submit=\"{{ g.submit }}\" style=\"display:flex;gap:7px;margin-top:11px\">\n                            <input value=\"{{ g.draft }}\" sc-camel-on-change=\"{{ g.onDraft }}\" placeholder=\"Answer it and Recall records your answer, not a guess\" style=\"flex:1;min-width:0;height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:500 12px Manrope,sans-serif\">\n                            <button type=\"submit\" style=\"height:32px;padding:0 13px;border-radius:8px;border:0;background:linear-gradient(90deg,#4192B9,#5AC3A7);color:#fff;font:700 11px Manrope,sans-serif\">Save<\u002Fbutton>\n                          <\u002Fform>\n                        <\u002Fsc-if>\n                        <sc-if value=\"{{ g.answered }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"margin-top:11px;padding:10px 12px;border-radius:8px;background:var(--panel);border:1px solid var(--line)\">\n                            <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.2em;color:#27AC53;margin-bottom:5px\">ANSWERED BY YOU · LANA MAROV<\u002Fdiv>\n                            <div style=\"font:600 12.5px/1.5 Manrope,sans-serif;color:var(--ink)\">{{ g.answer }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <div>\n              <button sc-camel-on-click=\"{{ toggleFields }}\" style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;margin-bottom:10px;padding:0;border:0;background:transparent;text-align:left\">\n                <span style=\"display:flex;align-items:center;gap:9px\">\n                  <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">EXTRACTED FIELDS<\u002Fspan>\n                  <span style=\"font:600 9.5px Manrope,sans-serif;color:var(--ink2);background:var(--panel3);padding:2.5px 7px;border-radius:5px\">{{ fieldsCount }}<\u002Fspan>\n                <\u002Fspan>\n                <span style=\"display:flex;align-items:center;gap:8px\">\n                  <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">{{ fieldsHint }}<\u002Fspan>\n                  <span style=\"font-size:10px;color:var(--ink3);transform:rotate({{ fieldsChevron }});transition:transform .15s ease;display:inline-block\">▾<\u002Fspan>\n                <\u002Fspan>\n              <\u002Fbutton>\n              <sc-if value=\"{{ fieldSyncOn }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ goClientFromField }}\" style=\"display:flex;align-items:center;gap:9px;width:100%;margin-bottom:9px;padding:10px 13px;border-radius:9px;border:1px solid rgba(39,172,83,.4);background:rgba(39,172,83,.08);text-align:left\">\n                  <span style=\"width:7px;height:7px;border-radius:50%;background:#27AC53;flex:none;display:block\"><\u002Fspan>\n                  <span style=\"flex:1;font:600 11.5px Manrope,sans-serif;color:var(--ink)\">{{ fieldSyncLabel }}<\u002Fspan>\n                  <span style=\"font:700 10.5px Manrope,sans-serif;color:#27AC53;white-space:nowrap\">Open profile →<\u002Fspan>\n                <\u002Fbutton>\n              <\u002Fsc-if>\n              <div style=\"border:1px solid var(--line);border-radius:10px;overflow:hidden;display:{{ fieldsDisplay }}\">\n                <sc-for list=\"{{ cur.fields }}\" as=\"f\" hint-placeholder-count=\"5\">\n                  <div style=\"display:grid;grid-template-columns:168px minmax(0,1fr) auto;gap:14px;align-items:center;padding:11px 15px;border-bottom:1px solid var(--line2);background:{{ f.bg }}\">\n                    <span style=\"font:600 11px JetBrains Mono,monospace;color:var(--ink3)\">{{ f.key }}<\u002Fspan>\n                    <sc-if value=\"{{ f.reading }}\" hint-placeholder-val=\"{{ true }}\">\n                      <span style=\"min-width:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap\">\n                        <span style=\"font:600 12.5px/1.5 Manrope,sans-serif;color:var(--ink)\">{{ f.val }}<\u002Fspan>\n                        <sc-if value=\"{{ f.edited }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.14em;color:#27AC53;background:rgba(39,172,83,.12);padding:2.5px 7px;border-radius:5px;white-space:nowrap\">EDITED BY YOU<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fspan>\n                      <button sc-camel-on-click=\"{{ f.start }}\" title=\"Change this value\" style=\"height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font:700 10.5px Manrope,sans-serif;white-space:nowrap\">✎ Edit<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ f.editing }}\" hint-placeholder-val=\"{{ false }}\">\n                      <form sc-camel-on-submit=\"{{ f.save }}\" style=\"display:flex;gap:7px;min-width:0\">\n                        <input value=\"{{ f.draft }}\" sc-camel-on-change=\"{{ f.onDraft }}\" sc-camel-auto-focus=\"{{ true }}\" style=\"flex:1;min-width:0;height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);font:600 12.5px Manrope,sans-serif\">\n                      <\u002Fform>\n                      <span style=\"display:flex;gap:6px\">\n                        <button sc-camel-on-click=\"{{ f.save }}\" style=\"height:26px;padding:0 11px;border-radius:7px;border:0;background:linear-gradient(90deg,#4192B9,#5AC3A7);color:#fff;font:700 10.5px Manrope,sans-serif\">Save<\u002Fbutton>\n                        <button sc-camel-on-click=\"{{ f.cancel }}\" style=\"height:26px;padding:0 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2);color:var(--ink2);font:700 10.5px Manrope,sans-serif\">Cancel<\u002Fbutton>\n                      <\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabTranscript }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:20px 28px 40px\">\n            <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px\">\n              <span style=\"font:600 11.5px Manrope,sans-serif;color:var(--ink2)\">{{ cur.diarLine }}<\u002Fspan>\n              <span style=\"font:500 11px Manrope,sans-serif;color:var(--ink3)\">AI transcript · verbatim, no cleanup or paraphrase<\u002Fspan>\n              <sc-if value=\"{{ cur.hasUnknown }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ openNamer }}\" style=\"height:27px;padding:0 11px;border-radius:7px;border:1px solid #FF6A00;background:rgba(255,106,0,.10);color:#FF6A00;font:700 11px Manrope,sans-serif\">Name unrecognised voice<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px;max-width:760px\">\n              <sc-for list=\"{{ cur.lines }}\" as=\"l\" hint-placeholder-count=\"8\">\n                <div style=\"display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start;padding:12px 0 14px;border-top:1px solid {{ l.divider }}\">\n                  <span style=\"font:500 11px JetBrains Mono,monospace;color:var(--ink3);padding-top:3px\">{{ l.t }}<\u002Fspan>\n                  <div style=\"min-width:0\">\n                    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:5px;display:{{ l.nameDisplay }}\">\n                      <span style=\"width:22px;height:22px;border-radius:50%;background:{{ l.color }};color:#fff;display:grid;place-items:center;font:700 8.5px Manrope,sans-serif;flex:none\">{{ l.ini }}<\u002Fspan>\n                      <span style=\"font:800 12.5px Manrope,sans-serif;color:{{ l.nameColor }};letter-spacing:.005em\">{{ l.who }}<\u002Fspan>\n                      <span style=\"font:600 9.5px Manrope,sans-serif;color:#FF6A00;background:rgba(255,106,0,.11);padding:2px 6px;border-radius:4px;display:{{ l.confDisplay }}\">{{ l.conf }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font:500 14px/1.8 Manrope,sans-serif;color:var(--ink);opacity:.86;text-wrap:pretty\">{{ l.text }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ tabExport }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"padding:22px 28px 40px\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px\">\n              <div style=\"font:500 12.5px/1.6 Manrope,sans-serif;color:var(--ink2);max-width:560px\">This is the exact markdown handed to the Maverio LLM pipeline. One file per meeting, front-matter carries the structured fields.<\u002Fdiv>\n              <div style=\"display:flex;gap:8px\">\n                <button sc-camel-on-click=\"{{ toggleRedact }}\" style=\"height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:{{ redactBg }};color:{{ redactFg }};font:700 11px Manrope,sans-serif\">{{ redactLabel }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ toggleRedactNames }}\" style=\"height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:{{ redactNamesBg }};color:{{ redactNamesFg }};font:700 11px Manrope,sans-serif\">{{ redactNamesLabel }}<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ copyMd }}\" style=\"height:30px;padding:0 14px;border-radius:8px;border:0;background:linear-gradient(90deg,#4192B9,#5AC3A7);color:#fff;font:700 11px Manrope,sans-serif\">{{ copyLabel }}<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <pre style=\"margin:0;padding:18px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);font:400 11.5px/1.85 JetBrains Mono,monospace;color:var(--ink);white-space:pre-wrap;word-break:break-word\">{{ cur.markdown }}<\u002Fpre>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ VOICES ============ -->\n        <sc-if value=\"{{ isVoices }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:26px 28px 40px\">\n          <h1 style=\"font:600 27px/1.15 Poppins,sans-serif;color:var(--ink);margin:0 0 5px;letter-spacing:-.01em\">Voices<\u002Fh1>\n          <div style=\"font:500 12.5px Manrope,sans-serif;color:var(--ink2);margin-bottom:24px\">{{ voiceSub }}<\u002Fdiv>\n\n          <sc-if value=\"{{ hasPending }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-bottom:30px\">\n            <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:#FF6A00;margin-bottom:11px\">NEEDS A NAME<\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:11px\">\n              <sc-for list=\"{{ pending }}\" as=\"v\" hint-placeholder-count=\"3\">\n                <div style=\"padding:15px;border:1px solid rgba(255,106,0,.35);border-radius:11px;background:rgba(255,106,0,.05)\">\n                  <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:12px\">\n                    <button sc-camel-on-click=\"{{ v.play }}\" title=\"{{ v.playTitle }}\" style=\"width:34px;height:34px;border-radius:50%;border:1px solid {{ v.playBorder }};background:{{ v.playBg }};color:{{ v.playFg }};display:grid;place-items:center;font-size:11px;padding:0 0 0 {{ v.playPad }};flex:none\" style-hover=\"border-color:#4192B9\">{{ v.playIcon }}<\u002Fbutton>\n                    <div style=\"min-width:0\">\n                      <div style=\"font:700 13px Manrope,sans-serif;color:var(--ink)\">{{ v.label }}<\u002Fdiv>\n                      <div style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">{{ v.meta }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div sc-camel-on-click=\"{{ v.play }}\" style=\"display:flex;align-items:flex-end;gap:2px;height:30px;margin-bottom:8px;cursor:pointer\">\n                    <sc-for list=\"{{ v.wave }}\" as=\"w\" hint-placeholder-count=\"26\">\n                      <span style=\"flex:1;height:{{ w.h }};background:linear-gradient(180deg,#4192B9,#5AC3A7);border-radius:2px;opacity:{{ w.op }};transform-origin:bottom;animation:{{ w.anim }};display:block\"><\u002Fspan>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px\">\n                    <span style=\"font:500 10.5px JetBrains Mono,monospace;color:var(--ink3)\">{{ v.clip }}<\u002Fspan>\n                    <span style=\"font:600 10.5px Manrope,sans-serif;color:#4192B9\">{{ v.playState }}<\u002Fspan>\n                  <\u002Fdiv>\n border:1px solid var(--line);padding:2px 6px;border-radius:4px;flex:none\">{{ v.match }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ EXPORT ============ -->\n        <sc-if value=\"{{ isExport }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:26px 28px 40px\">\n          <h1 style=\"font:600 27px/1.15 Poppins,sans-serif;color:var(--ink);margin:0 0 5px;letter-spacing:-.01em\">Company knowledge base<\u002Fh1>\n          <div style=\"font:500 12.5px/1.6 Manrope,sans-serif;color:var(--ink2);max-width:620px;margin-bottom:22px\">Everything Recall captures becomes one markdown file per meeting, with structured front-matter. This is the corpus your in-house model trains on.<\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:10px;margin-bottom:26px\">\n            <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"4\">\n              <div style=\"padding:15px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)\">\n                <div style=\"font:600 25px/1 Poppins,sans-serif;color:var(--ink);margin-bottom:6px\">{{ s.n }}<\u002Fdiv>\n                <div style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3);letter-spacing:.04em\">{{ s.label }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n\n          <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:11px\">CORPUS<\u002Fdiv>\n          <div style=\"border:1px solid var(--line);border-radius:11px;overflow:hidden\">\n            <sc-for list=\"{{ corpus }}\" as=\"c\" hint-placeholder-count=\"6\">\n              <div sc-camel-on-click=\"{{ c.open }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line2);c rder:1px dashed var(--line);border-radius:11px;background:var(--panel2);display:flex;align-items:center;gap:12px\">\n                    <div sc-camel-on-click=\"{{ c.open }}\" style=\"flex:1;min-width:0;cursor:pointer\">\n                      <div style=\"font:700 13.5px Manrope,sans-serif;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.name }}<\u002Fdiv>\n                      <div style=\"font:500 11px Manrope,sans-serif;color:var(--ink3);margin-top:4px\">{{ c.practice }} · {{ c.meetings }} meetings on file<\u002Fdiv>\n                    <\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ c.restore }}\" style=\"height:28px;padding:0 11px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink2);font:700 10.5px Manrope,sans-serif;white-space:nowrap\">Restore<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <\u002Fsc-if>\n\n          <!-- new / edit client form -->\n          <sc-if value=\"{{ clientModeForm }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:12px\">THE COMPANY<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:9px\">\n                  <sc-for list=\"{{ clientFields }}\" as=\"f\" hint-placeholder-count=\"6\">\n                    <label style=\"display:block\">\n                      <span style=\"display:block;font:700 10px Manrope,sans-serif;letter-spacing:.08em;color:var(--ink3);margin-bottom:5px\">{{ f.label }}<\u002Fspan>\n                      <input value=\"{{ f.value }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.placeholder }}\" style=\"width:100%;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:500 12.5px Manrope,sans-serif;color:var(--ink)\">\n                    <\u002Flabel>\n                  <\u002Fsc-for>\n                  <label style=\"display:block\">\n                    <span style=\"display:block;font:700 10px Manrope,sans-serif;letter-spacing:.08em;color:var(--ink3);margin-bottom:5px\">NOTES<\u002Fspan>\n                    <textarea value=\"{{ newNotes }}\" sc-camel-on-change=\"{{ onNewNotes }}\" placeholder=\"How they buy, who really decides, anything the team should know before a call\" style=\"width:100%;height:74px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:500 12.5px/1.6 Manrope,sans-serif;color:var(--ink);resize:vertical\"><\u002Ftextarea>\n                  <\u002Flabel>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:12px\">\n                  <sc-for list=\"{{ newPractices }}\" as=\"p\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ p.pick }}\" style=\"height:28px;padding:0 11px;border-radius:20px;border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.fg }};font:700 11px Manrope,sans-serif;display:flex;align-items:center;gap:6px\">\n                      <span style=\"width:7px;height:7px;border-radius:50%;background:{{ p.dot }};display:block\"><\u002Fspan>{{ p.label }}\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:8px\">\n                  <sc-for list=\"{{ newStages }}\" as=\"g\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ g.pick }}\" style=\"height:28px;padding:0 11px;border-radius:20px;border:1px solid {{ g.border }};background:{{ g.bg }};color:{{ g.fg }};font:600 11px Manrope,sans-serif\">{{ g.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px\">\n                  <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">KEY PEOPLE<\u002Fspan>\n                  <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">project managers, decision makers, finance<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:12px\">\n                  <sc-for list=\"{{ newContacts }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;background:var(--panel2)\">\n                      <span style=\"width:26px;height:26px;border-radius:50%;background:{{ c.color }};color:#fff;display:grid;place-items:center;font:700 9px Manrope,sans-serif\">{{ c.ini }}<\u002Fspan>\n                      <div style=\"min-width:0\">\n                        <div style=\"font:700 12px Manrope,sans-serif;color:var(--ink)\">{{ c.name }} <span style=\"font:600 11px Manrope,sans-serif;color:var(--ink3)\">· {{ c.role }}<\u002Fspan><\u002Fdiv>\n                        <div style=\"font:500 10.5px Manrope,sans-serif;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.line }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <button sc-camel-on-click=\"{{ c.remove }}\" style=\"width:22px;height:22px;border-radius:6px;border:0;background:transparent;color:var(--ink3);font-size:12px\" style-hover=\"color:#FF6A00\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <form sc-camel-on-submit=\"{{ addContact }}\" style=\"display:grid;grid-template-columns:1fr 1fr;gap:7px\">\n                  <input value=\"{{ ctName }}\" sc-camel-on-change=\"{{ onCtName }}\" placeholder=\"Full name\" style=\"height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:500 12px Manrope,sans-serif;color:var(--ink)\">\n                  <input value=\"{{ ctRole }}\" sc-camel-on-change=\"{{ onCtRole }}\" placeholder=\"Role, e.g. Project manager\" style=\"height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:500 12px Manrope,sans-serif;color:var(--ink)\">\n                  <input value=\"{{ ctEmail }}\" sc-camel-on-change=\"{{ onCtEmail }}\" placeholder=\"Email\" style=\"height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:500 12px Manrope,sans-serif;color:var(--ink)\">\n                  <input value=\"{{ ctPhone }}\" sc-camel-on-change=\"{{ onCtPhone }}\" placeholder=\"Phone\" style=\"height:32px;padding:0 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:500 12px Manrope,sans-serif;color:var(--ink)\">\n                  <button type=\"submit\" style=\"grid-column:span 2;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font:700 11px Manrope,sans-serif\">+ Add person<\u002Fbutton>\n                <\u002Fform>\n              <\u002Fdiv>\n\n              <div style=\"padding:17px 18px;border-radius:11px;background:var(--tint);border:1px solid var(--line2)\">\n                <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:10px\">WHAT HAPPENS ON SAVE<\u002Fdiv>\n                <div style=\"font:500 12px/1.7 Manrope,sans-serif;color:var(--ink2);margin-bottom:14px\">{{ saveIntro }}<\u002Fdiv>\n                <div style=\"display:flex;gap:8px\">\n                  <button sc-camel-on-click=\"{{ cancelClientForm }}\" style=\"flex:none;height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink2);font:700 12px Manrope,sans-serif\">Cancel<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ saveClient }}\" style=\"flex:1;height:38px;border-radius:9px;border:0;background:{{ saveClientBg }};color:{{ saveClientFg }};font:700 12.5px Manrope,sans-serif\">{{ saveClientLabel }}<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- detail -->\n          <sc-if value=\"{{ clientModeDetail }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start\">\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <div style=\"border:1px solid var(--line);border-radius:11px;overflow:hidden\">\n                <sc-for list=\"{{ detailFacts }}\" as=\"f\" hint-placeholder-count=\"7\">\n                  <div style=\"display:grid;grid-template-columns:132px minmax(0,1fr);gap:14px;padding:11px 15px;border-bottom:1px solid var(--line2);background:{{ f.bg }}\">\n                    <span style=\"font:600 11px JetBrains Mono,monospace;color:var(--ink3)\">{{ f.k }}<\u002Fspan>\n                    <span style=\"font:600 12.5px/1.55 Manrope,sans-serif;color:var(--ink)\">{{ f.v }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px\">\n                  <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">NOTES<\u002Fspan>\n                  <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">{{ noteCount }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"max-height:230px;overflow:auto;padding-right:4px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px\">\n                  <sc-for list=\"{{ detailNotes }}\" as=\"n\" hint-placeholder-count=\"2\">\n                    <div style=\"padding-bottom:12px;border-bottom:1px solid {{ n.divider }}\">\n                      <div style=\"font:600 10px Manrope,sans-serif;letter-spacing:.05em;color:var(--ink3);margin-bottom:5px\">{{ n.meta }}<\u002Fdiv>\n                      <div style=\"font:500 12.5px/1.7 Manrope,sans-serif;color:var(--ink2);text-wrap:pretty\">{{ n.text }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <form sc-camel-on-submit=\"{{ addNote }}\" style=\"display:flex;flex-direction:column;gap:7px\">\n                  <textarea value=\"{{ noteDraft }}\" sc-camel-on-change=\"{{ onNoteDraft }}\" placeholder=\"Add a note — what changed, who to watch, what to raise next time\" style=\"width:100%;height:62px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:500 12.5px/1.6 Manrope,sans-serif;color:var(--ink);resize:vertical\"><\u002Ftextarea>\n                  <button type=\"submit\" style=\"height:32px;border-radius:8px;border:0;background:{{ noteBtnBg }};color:{{ noteBtnFg }};font:700 11.5px Manrope,sans-serif\">{{ noteBtnLabel }}<\u002Fbutton>\n                <\u002Fform>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:11px\">KEY PEOPLE<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px\">\n                  <sc-for list=\"{{ detailContacts }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:11px;align-items:center\">\n                      <span style=\"width:28px;height:28px;border-radius:50%;background:{{ c.color }};color:#fff;display:grid;place-items:center;font:700 9.5px Manrope,sans-serif\">{{ c.ini }}<\u002Fspan>\n                      <div style=\"min-width:0\">\n                        <div style=\"font:700 12.5px Manrope,sans-serif;color:var(--ink)\">{{ c.name }} <span style=\"font:600 11px Manrope,sans-serif;color:var(--ink3)\">· {{ c.role }}<\u002Fspan><\u002Fdiv>\n                        <div style=\"font:500 10.5px Manrope,sans-serif;color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ c.line }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"font:600 9.5px Manrope,sans-serif;color:{{ c.vpColor }};background:{{ c.vpTint }};padding:3px 7px;border-radius:20px;white-space:nowrap\">{{ c.vp }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:11px\">MEETINGS<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <sc-for list=\"{{ detailMeetings }}\" as=\"m\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ m.open }}\" style=\"display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:transparent;text-align:left\" style-hover=\"border-color:var(--aqua1);background:var(--tint)\">\n                      <span style=\"min-width:0\">\n                        <span style=\"display:block;font:700 12.5px Manrope,sans-serif;color:var(--ink)\">{{ m.title }}<\u002Fspan>\n                        <span style=\"display:block;font:600 10.5px Manrope,sans-serif;color:var(--ink3);margin-top:3px\">{{ m.meta }}<\u002Fspan>\n                      <\u002Fspan>\n                      <span style=\"font:500 11px JetBrains Mono,monospace;color:var(--ink3);white-space:nowrap\">{{ m.date }}<\u002Fspan>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ PREP A MEETING ============ -->\n        <sc-if value=\"{{ isPrep }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:26px 28px 40px\">\n          <h1 style=\"font:600 27px/1.15 Poppins,sans-serif;color:var(--ink);margin:0 0 5px;letter-spacing:-.01em\">Prep a meeting<\u002Fh1>\n          <div style=\"font:500 12.5px Manrope,sans-serif;color:var(--ink2);margin-bottom:24px\">Set the agenda and the outcomes you want before you walk in. Recall marks each item as it is covered and tells you afterwards what you did not get.<\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start\">\n\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:11px\">THE MEETING<\u002Fdiv>\n                <input value=\"{{ prepTitle }}\" sc-camel-on-change=\"{{ onPrepTitle }}\" placeholder=\"What is this meeting called?\" style=\"width:100%;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:600 13px Manrope,sans-serif;color:var(--ink);margin-bottom:10px\">\n                <input value=\"{{ prepClient }}\" sc-camel-on-change=\"{{ onPrepClient }}\" placeholder=\"Client or team\" style=\"width:100%;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font:500 12.5px Manrope,sans-serif;color:var(--ink);margin-bottom:11px\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:6px\">\n                  <sc-for list=\"{{ prepPractices }}\" as=\"p\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ p.pick }}\" style=\"height:28px;padding:0 11px;border-radius:20px;border:1px solid {{ p.border }};background:{{ p.bg }};color:{{ p.fg }};font:700 11px Manrope,sans-serif;display:flex;align-items:center;gap:6px\">\n                      <span style=\"width:7px;height:7px;border-radius:50%;background:{{ p.dot }};display:block\"><\u002Fspan>{{ p.label }}\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px\">\n                  <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">AGENDA<\u002Fspan>\n                  <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">becomes chapter markers in the transcript<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:10px\">\n                  <sc-for list=\"{{ agenda }}\" as=\"a\" hint-placeholder-count=\"3\">\n                    <div style=\"display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;background:var(--panel2)\">\n                      <span style=\"font:700 11px JetBrains Mono,monospace;color:var(--ink3)\">{{ a.n }}<\u002Fspan>\n                      <span style=\"font:600 12.5px/1.45 Manrope,sans-serif;color:var(--ink)\">{{ a.text }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ a.remove }}\" title=\"Remove\" style=\"width:22px;height:22px;border-radius:6px;border:0;background:transparent;color:var(--ink3);font-size:12px\" style-hover=\"color:#FF6A00\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <form sc-camel-on-submit=\"{{ addAgenda }}\" style=\"display:flex;gap:7px\">\n                  <input value=\"{{ agendaDraft }}\" sc-camel-on-change=\"{{ onAgendaDraft }}\" placeholder=\"Add an agenda item\" style=\"flex:1;min-width:0;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:500 12.5px Manrope,sans-serif;color:var(--ink)\">\n                  <button type=\"submit\" style=\"width:34px;height:34px;border-radius:8px;border:0;background:linear-gradient(135deg,#4192B9,#5AC3A7);color:#fff;font-size:15px;flex:none\">+<\u002Fbutton>\n                <\u002Fform>\n              <\u002Fdiv>\n\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px\">\n                  <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">PROPOSED OUTCOMES<\u002Fspan>\n                  <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">checked against real decisions<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px;margin-bottom:10px\">\n                  <sc-for list=\"{{ outcomes }}\" as=\"o\" hint-placeholder-count=\"2\">\n                    <div style=\"display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 11px;border-radius:8px;background:var(--tint)\">\n                      <span style=\"width:13px;height:13px;border-radius:4px;border:1.5px solid var(--aqua1);display:block\"><\u002Fspan>\n                      <span style=\"font:600 12.5px/1.45 Manrope,sans-serif;color:var(--ink)\">{{ o.text }}<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ o.remove }}\" title=\"Remove\" style=\"width:22px;height:22px;border-radius:6px;border:0;background:transparent;color:var(--ink3);font-size:12px\" style-hover=\"color:#FF6A00\">✕<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <form sc-camel-on-submit=\"{{ addOutcome }}\" style=\"display:flex;gap:7px\">\n                  <input value=\"{{ outcomeDraft }}\" sc-camel-on-change=\"{{ onOutcomeDraft }}\" placeholder=\"What has to be true when you leave?\" style=\"flex:1;min-width:0;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font:500 12.5px Manrope,sans-serif;color:var(--ink)\">\n                  <button type=\"submit\" style=\"width:34px;height:34px;border-radius:8px;border:0;background:linear-gradient(135deg,#4192B9,#5AC3A7);color:#fff;font-size:15px;flex:none\">+<\u002Fbutton>\n                <\u002Fform>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n                <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px\">\n                  <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3)\">VOICES IN THE ROOM<\u002Fspan>\n                  <span style=\"font:600 10.5px Manrope,sans-serif;color:var(--ink3)\">{{ attendeeCount }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px\">\n                  <sc-for list=\"{{ voicePicks }}\" as=\"v\" hint-placeholder-count=\"8\">\n                    <button sc-camel-on-click=\"{{ v.toggle }}\" title=\"{{ v.role }}\" style=\"display:flex;align-items:center;gap:7px;height:32px;padding:0 12px 0 4px;border-radius:20px;border:1px solid {{ v.border }};background:{{ v.bg }};font:600 11.5px Manrope,sans-serif;color:{{ v.fg }}\">\n                      <span style=\"width:24px;height:24px;border-radius:50%;background:{{ v.color }};color:#fff;display:grid;place-items:center;font:700 8.5px Manrope,sans-serif\">{{ v.ini }}<\u002Fspan>{{ v.name }}\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px\">\n                  <sc-for list=\"{{ guests }}\" as=\"g\" hint-placeholder-count=\"1\">\n                    <span style=\"display:flex;align-items:center;gap:7px;height:32px;padding:0 10px 0 4px;border-radius:20px;border:1px dashed #FF6A00;background:rgba(255,106,0,.06);font:600 11.5px Manrope,sans-serif;color:#FF6A00\">\n                      <span style=\"width:24px;height:24px;border-radius:50%;background:var(--panel3);color:var(--ink2);display:grid;place-items:center;font:700 10px Manrope,sans-serif\">?<\u002Fspan>{{ g.label }}\n                      <button sc-camel-on-click=\"{{ g.remove }}\" style=\"border:0;background:transparent;color:#FF6A00;font-size:11px;padding:0 2px\">✕<\u002Fbutton>\n                    <\u002Fspan>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ addGuest }}\" style=\"height:30px;padding:0 12px;border-radius:8px;border:1px dashed var(--line);background:transparent;color:var(--ink2);font:700 11px Manrope,sans-serif\">+ Expected guest<\u002Fbutton>\n                <div style=\"font:500 11px/1.55 Manrope,sans-serif;color:var(--ink3);margin-top:10px\">Known voices are matched instantly. Each expected guest reserves a voiceprint slot, so their turns are separated from the start and you only have to name them once.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:17px 18px;border-radius:11px;background:var(--tint);border:1px solid var(--line2)\">\n                <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:12px\">RECORDING BRIEF<\u002Fdiv>\n                <div style=\"font:600 15px/1.5 Poppins,sans-serif;color:var(--ink);margin-bottom:12px\">{{ briefTitle }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px;margin-bottom:16px\">\n                  <sc-for list=\"{{ brief }}\" as=\"b\" hint-placeholder-count=\"4\">\n                    <div style=\"display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px\">\n                      <span style=\"font:600 11px JetBrains Mono,monospace;color:var(--ink3)\">{{ b.k }}<\u002Fspan>\n                      <span style=\"font:600 12px/1.5 Manrope,sans-serif;color:var(--ink)\">{{ b.v }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ armMeeting }}\" style=\"width:100%;height:38px;border-radius:9px;border:0;background:{{ armBg }};color:{{ armFg }};font:700 12.5px Manrope,sans-serif;margin-bottom:8px\">{{ armLabel }}<\u002Fbutton>\n                <div style=\"font:500 10.5px/1.55 Manrope,sans-serif;color:var(--ink3);display:{{ discloseDisplay }}\">Disclosure prompt is on: read the one-line script at the top of the call before you begin.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ TEAM & SEATS ============ -->\n        <sc-if value=\"{{ isTeam }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"padding:26px 28px 40px\">\n          <h1 style=\"font:600 27px/1.15 Poppins,sans-serif;color:var(--ink);margin:0 0 5px;letter-spacing:-.01em\">Team &amp; seats<\u002Fh1>\n          <div style=\"font:500 12.5px Manrope,sans-serif;color:var(--ink2);margin-bottom:16px\">{{ seatLine }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;background:{{ ownerBannerBg }};border:1px solid {{ ownerBannerBorder }};margin-bottom:22px\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:{{ ownerBannerDot }};flex:none;display:block\"><\u002Fspan>\n            <span style=\"font:600 11.5px/1.5 Manrope,sans-serif;color:var(--ink2)\">{{ ownerBanner }}<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px;margin-bottom:26px\">\n            <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)\">\n              <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:10px\">INSTALL LINK<\u002Fdiv>\n              <div style=\"font:500 11.5px JetBrains Mono,monospace;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ inviteLink }}<\u002Fdiv>\n              <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                <button sc-camel-on-click=\"{{ copyLink }}\" style=\"height:30px;padding:0 13px;border-radius:8px;border:0;background:linear-gradient(90deg,#4192B9,#5AC3A7);color:#fff;font:700 11px Manrope,sans-serif\">{{ copyLinkLabel }}<\u002Fbutton>\n                <button style=\"height:30px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:700 11px Manrope,sans-serif\">Download for macOS<\u002Fbutton>\n              <\u002Fdiv>\n              <div style=\"font:500 10.5px Manrope,sans-serif;color:var(--ink3);margin-top:9px\">Recall 1.4 · Apple silicon &amp; Intel · macOS 14+ · 38 MB. Only @maverio.com addresses can redeem the link.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:16px 17px;border:1px solid var(--line);border-radius:11px\">\n              <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:10px\">INVITE A COLLEAGUE<\u002Fdiv>\n              <form sc-camel-on-submit=\"{{ onInvite }}\" style=\"display:flex;flex-direction:column;gap:8px\">\n                <input value=\"{{ inviteEmail }}\" sc-camel-on-change=\"{{ onInviteEmail }}\" placeholder=\"name@maverio.com\" style=\"height:34px;padding:0 12px;border-radius:8px;border:1px solid {{ inviteBorder }};background:var(--panel2);font:500 12.5px Manrope,sans-serif;color:var(--ink)\">\n                <div style=\"display:flex;gap:6px\">\n                  <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"2\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ r.pick }}\" style=\"flex:1;height:30px;border-radius:8px;border:1px solid {{ r.border }};background:{{ r.bg }};color:{{ r.fg }};font:700 11px Manrope,sans-serif\">{{ r.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:6px\">\n                  <sc-for list=\"{{ scopes }}\" as=\"c\" hint-placeholder-count=\"2\">\n                    <button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" style=\"flex:1;height:30px;border-radius:8px;border:1px solid {{ c.border }};background:{{ c.bg }};color:{{ c.fg }};font:700 11px Manrope,sans-serif\">{{ c.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <button type=\"submit\" style=\"height:34px;border-radius:8px;border:0;background:{{ inviteBtnBg }};color:{{ inviteBtnFg }};font:700 11.5px Manrope,sans-serif\">{{ inviteBtnLabel }}<\u002Fbutton>\n              <\u002Fform>\n              <div style=\"font:500 10.5px/1.5 Manrope,sans-serif;color:var(--ink3);margin-top:9px\">{{ inviteHelp }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"font:700 9px Manrope,sans-serif;letter-spacing:.26em;color:var(--ink3);margin-bottom:11px\">MEMBERS<\u002Fdiv>\n          <div style=\"border:1px solid var(--line);border-radius:11px;overflow:hidden\">\n            <sc-for list=\"{{ team }}\" as=\"t\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:32px minmax(0,1fr) auto auto auto;gap:12px;align-items:center;padding:12px 15px;border-bottom:1px solid var(--line2);background:{{ t.rowBg }}\">\n                <span style=\"width:32px;height:32px;border-radius:50%;background:{{ t.color }};color:#fff;display:grid;place-items:center;font:700 10.5px Manrope,sans-serif\">{{ t.ini }}<\u002Fspan>\n                <div style=\"min-width:0\">\n                  <div style=\"display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                    <span style=\"font:700 13px Manrope,sans-serif;color:var(--ink)\">{{ t.name }}<\u002Fspan>\n                    <span style=\"font:700 9px Manrope,sans-serif;letter-spacing:.05em;padding:2.5px 7px;border-radius:5px;background:{{ t.roleTint }};color:{{ t.roleColor }}\">{{ t.role }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"font:500 11px Manrope,sans-serif;color:var(--ink3);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ t.email }} · {{ t.seen }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:0;border:1px solid var(--line);b
